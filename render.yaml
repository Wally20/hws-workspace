services:
  - type: web
    name: hws-workspace
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && ./scripts/check_release.sh && python manage.py collectstatic --noinput --clear
    startCommand: ./scripts/start.sh --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 120
    healthCheckPath: /login
    disk:
      name: workspace-storage
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: www.workspace.hwsvoetbalschool.nl
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://www.workspace.hwsvoetbalschool.nl
      - key: TRUSTED_HOSTS
        value: www.workspace.hwsvoetbalschool.nl
      - key: SESSION_COOKIE_NAME
        value: overzicht_session
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: SESSION_COOKIE_SAMESITE
        value: Lax
      - key: SESSION_IDLE_TIMEOUT_SECONDS
        value: "3600"
      - key: SESSION_ABSOLUTE_TIMEOUT_SECONDS
        value: "43200"
      - key: SESSION_EXPIRE_AT_BROWSER_CLOSE
        value: "1"
      - key: TRAINER_INVITE_TTL_HOURS
        value: "48"
      - key: PREFERRED_URL_SCHEME
        value: https
      - key: DATA_DIR
        value: /opt/render/project/src/storage/data
      - key: SQLITE_BUSY_TIMEOUT_MS
        value: "30000"
      - key: STORAGE_BACKUP_RETENTION
        value: "7"
      - key: LOCAL_UPLOAD_ROOT
        value: /opt/render/project/src/storage/uploads
      - key: REVERSE_PROXY_HOPS
        value: "1"
      - key: LOGIN_IP_RATE_LIMIT_MULTIPLIER
        value: "5"
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ECWID_STORE_ID
        sync: false
      - key: ECWID_SECRET_TOKEN
        sync: false
      - key: ECWID_AUTO_RETURN_REFUNDED_ORDERS
        value: "1"
      - key: MONEYBIRD_API_TOKEN
        sync: false
      - key: MONEYBIRD_ADMINISTRATION_ID
        sync: false
      - key: EMAIL_HOST
        value: smtp.strato.de
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_SSL
        value: "0"
      - key: EMAIL_USE_TLS
        value: "1"
      - key: EMAIL_HOST_USER
        value: info@hwsvoetbalschool.nl
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: info@hwsvoetbalschool.nl
      - key: REGISTRATION_AUTO_EMAILS_ENABLED
        value: "1"
      - key: REGISTRATION_AUTO_EMAILS_START_DATE
        value: "2026-06-03"
      - key: REGISTRATION_EMAIL_ONLY_PAID
        value: "1"
      - key: REGISTRATION_EMAIL_SYNC_ECWID_PROCESSING
        value: "1"
      - key: REGISTRATION_EMAIL_FROM_NAME
        value: HWS Voetbalschool
      - key: REGISTRATION_EMAIL_SUBJECT
        value: Bevestiging inschrijving HWS Voetbalschool
      - key: REGISTRATION_EMAIL_BCC
        value: david.van.walstijn@gmail.com
      - key: REGISTRATION_EMAIL_REPLY_TO
        value: info@hwsvoetbalschool.nl
      - key: BUNNY_STORAGE_REGION
        sync: false
      - key: BUNNY_STORAGE_ZONE
        sync: false
      - key: BUNNY_STORAGE_ACCESS_KEY
        sync: false
      - key: BUNNY_API_ACCESS_KEY
        sync: false
      - key: BUNNY_IMAGE_PUBLIC_BASE
        sync: false
      - key: BUNNY_IMAGE_BASE_PATH
        value: content
      - key: BUNNY_IMAGE_MAX_UPLOAD_MB
        value: "15"
      - key: CONTENT_UPLOAD_MAX_REQUEST_MB
        value: "250"
      - key: CONTENT_UPLOAD_MAX_FILES
        value: "500"
      - key: BUNNY_IMAGE_ALLOWED_TYPES
        value: image/jpeg,image/png,image/webp,image/avif
      - key: BUNNY_VIDEO_PUBLIC_BASE
        sync: false
      - key: BUNNY_VIDEO_BASE_PATH
        value: exercise-videos
      - key: BUNNY_VIDEO_MAX_UPLOAD_MB
        value: "5000"
      - key: LOCAL_VIDEO_MAX_UPLOAD_MB
        value: "250"
      - key: BUNNY_VIDEO_ALLOWED_TYPES
        value: video/mp4,video/webm,video/quicktime
